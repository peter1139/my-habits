<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Journal & Record Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
          <i data-lucide="image-plus" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Photo & Log Dashboard</h1>
          <p class="text-xs text-slate-400">บันทึกรูปภาพ รายละเอียด และวันที่</p>
        </div>
      </div>
      <button onclick="toggleModal(true)" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-600/30 active:scale-95">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>เพิ่มรายการใหม่</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-8">

    <!-- Filters & Stats Bar -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">รายการทั้งหมด</p>
          <p id="totalCount" class="text-2xl font-bold text-white mt-1">0</p>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="md:col-span-2 bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex flex-col sm:flex-row gap-3 items-center">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
          <input type="text" id="searchInput" placeholder="ค้นหาจากรายละเอียด..." oninput="renderTable()"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
        </div>
        <input type="date" id="filterDate" onchange="renderTable()"
          class="w-full sm:w-auto bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
        <button onclick="clearFilter()" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-2 whitespace-nowrap">
          ล้างตัวกรอง
        </button>
      </div>
    </div>

    <!-- Data Table / Card Container -->
    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-700/80 bg-slate-900/80 text-xs font-semibold text-slate-400 uppercase tracking-wider">
              <th class="py-4 px-6 w-36">Date (วันที่)</th>
              <th class="py-4 px-6 w-44">Image (รูปภาพ)</th>
              <th class="py-4 px-6">Detail (รายละเอียด)</th>
              <th class="py-4 px-6 text-right w-24">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800 text-sm">
            <!-- Data rows inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-16 text-center text-slate-500">
        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
        <p class="text-base font-medium">ยังไม่มีข้อมูลบันทึก</p>
        <p class="text-xs mt-1">กดปุ่ม "เพิ่มรายการใหม่" เพื่อเริ่มบันทึกรูปและรายละเอียด</p>
      </div>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div id="formModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl p-6 relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
        <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-blue-400"></i>
          เพิ่มบันทึกใหม่
        </h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <!-- Date Column -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Date (วันที่) *</label>
          <input type="date" id="inputDate" required
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Image Column -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Image (อัปโหลดรูปภาพ) *</label>
          <div class="border-2 border-dashed border-slate-700 hover:border-blue-500/70 rounded-xl p-4 text-center cursor-pointer transition relative bg-slate-950/50" onclick="document.getElementById('inputImage').click()">
            <input type="file" id="inputImage" accept="image/*" required class="hidden" onchange="previewImage(event)">
            <div id="uploadPlaceholder">
              <i data-lucide="upload-cloud" class="w-8 h-8 mx-auto text-slate-400 mb-2"></i>
              <p class="text-xs text-slate-300">คลิกเพื่อเลือกรูปภาพจากเครื่อง</p>
              <p class="text-[10px] text-slate-500 mt-1">PNG, JPG, WebP รองรับทั้งหมด</p>
            </div>
            <img id="imagePreview" class="hidden max-h-48 mx-auto rounded-lg object-contain shadow-md">
          </div>
        </div>

        <!-- Detail Column -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Detail (รายละเอียด) *</label>
          <textarea id="inputDetail" rows="3" required placeholder="ใส่คำอธิบาย บันทึก หรือรายละเอียดงาน..."
            class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-blue-600/30">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fullscreen Image Viewer Modal -->
  <div id="viewerModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden" onclick="toggleViewer(false)">
    <div class="relative max-w-4xl max-h-[90vh]">
      <img id="viewerImage" src="" class="max-w-full max-h-[85vh] rounded-xl object-contain mx-auto shadow-2xl">
      <p id="viewerCaption" class="text-center text-sm text-slate-300 mt-3"></p>
    </div>
  </div>

  <script>
    // --- IndexedDB Configuration (เก็บรูปภาพได้ไม่จำกัดพื้นที่เบราว์เซอร์) ---
    const DB_NAME = "MediaLogDB";
    const DB_VERSION = 1;
    const STORE_NAME = "records";
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
            dbInstance.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function getAllRecords() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function addRecordToDB(record) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.add(record);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteRecordFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // --- State & DOM ---
    let recordsData = [];
    let currentBase64Image = null;

    window.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("inputDate").valueAsDate = new Date();
      await initDB();
      await loadData();
      lucide.createIcons();
    });

    async function loadData() {
      recordsData = await getAllRecords();
      // เรียงลำดับจากวันที่ล่าสุดขึ้นก่อน
      recordsData.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      const emptyState = document.getElementById("emptyState");
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const filterDate = document.getElementById("filterDate").value;

      const filtered = recordsData.filter(item => {
        const matchSearch = item.detail.toLowerCase().includes(searchTerm);
        const matchDate = filterDate ? item.date === filterDate : true;
        return matchSearch && matchDate;
      });

      document.getElementById("totalCount").innerText = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      tbody.innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-800/40 transition group">
          <!-- Date -->
          <td class="py-4 px-6 align-top whitespace-nowrap text-slate-300 font-medium">
            <div class="flex items-center gap-2">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-500"></i>
              ${formatDate(item.date)}
            </div>
          </td>
          <!-- Image -->
          <td class="py-4 px-6 align-top">
            <div class="w-24 h-24 rounded-xl overflow-hidden bg-slate-950 border border-slate-700/80 cursor-pointer relative group/img shadow-sm"
                 onclick="openViewer('${item.image}', '${escapeHtml(item.detail)}')">
              <img src="${item.image}" class="w-full h-full object-cover group-hover/img:scale-105 transition duration-300">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 flex items-center justify-center transition">
                <i data-lucide="maximize-2" class="w-5 h-5 text-white"></i>
              </div>
            </div>
          </td>
          <!-- Detail -->
          <td class="py-4 px-6 align-top text-slate-200">
            <p class="whitespace-pre-line leading-relaxed">${escapeHtml(item.detail)}</p>
          </td>
          <!-- Action -->
          <td class="py-4 px-6 align-top text-right">
            <button onclick="handleDelete(${item.id})" class="p-2 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="ลบรายการ">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join("");

      lucide.createIcons();
    }

    // --- Helpers ---
    function previewImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentBase64Image = event.target.result;
        const img = document.getElementById("imagePreview");
        img.src = currentBase64Image;
        img.classList.remove("hidden");
        document.getElementById("uploadPlaceholder").classList.add("hidden");
      };
      reader.readAsDataURL(file);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!currentBase64Image) {
        alert("กรุณาเลือกรูปภาพก่อนบันทึก");
        return;
      }

      const date = document.getElementById("inputDate").value;
      const detail = document.getElementById("inputDetail").value.trim();

      const newRecord = {
        date,
        detail,
        image: currentBase64Image,
        createdAt: new Date().toISOString()
      };

      await addRecordToDB(newRecord);
      await loadData();

      // Reset
      e.target.reset();
      currentBase64Image = null;
      document.getElementById("imagePreview").classList.add("hidden");
      document.getElementById("uploadPlaceholder").classList.remove("hidden");
      document.getElementById("inputDate").valueAsDate = new Date();
      toggleModal(false);
    }

    async function handleDelete(id) {
      if (confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) {
        await deleteRecordFromDB(id);
        await loadData();
      }
    }

    function toggleModal(show) {
      const modal = document.getElementById("formModal");
      modal.classList.toggle("hidden", !show);
    }

    function openViewer(src, caption) {
      document.getElementById("viewerImage").src = src;
      document.getElementById("viewerCaption").innerText = caption;
      document.getElementById("viewerModal").classList.remove("hidden");
    }

    function toggleViewer(show) {
      document.getElementById("viewerModal").classList.toggle("hidden", !show);
    }

    function clearFilter() {
      document.getElementById("searchInput").value = "";
      document.getElementById("filterDate").value = "";
      renderTable();
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
